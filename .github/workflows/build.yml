name: Build and test applications
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [calendar, calculator, weather]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 golang-go dbus-daemon qt6-base-dev qt6-declarative-dev qt6-declarative-dev-tools qt6-tools-dev qt6-l10n-tools libkf6calendarcore-dev qml6-module-qttest qml6-module-qtquick qml6-module-qtqml-workerscript
      - name: Test isolated source installer
        if: matrix.app == 'calculator'
        run: python3 -m unittest discover -s packaging/tests -v
      - name: Compile and stage selected application
        env:
          APP: ${{ matrix.app }}
        run: |
          cmake -S . -B tmp/build -G Ninja -DKOS_APPS="$APP" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/tmp/stage"
          cmake --build tmp/build --parallel 2
          cmake --install tmp/build
          test -s tmp/stage/share/doc/kos-apps/SHADER_NOTICE.md
          if [[ "$APP" == calendar || "$APP" == weather ]]; then
            test -s tmp/stage/share/doc/kos-apps/DEMO_UI_NOTICE.md
          fi
      - name: Run application regressions
        env:
          QT_QPA_PLATFORM: offscreen
          QT_FORCE_STDERR_LOGGING: '1'
        run: ctest --test-dir tmp/build --output-on-failure
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-${{ matrix.app }}
          path: |
            tmp/build/Testing/Temporary/
          if-no-files-found: ignore
