name: Standalone build
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    steps:
      - name: Install distribution build dependencies (Qt >=6.8, Go >=1.22)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends ca-certificates git python3 build-essential cmake ninja-build golang-go qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools qt6-wayland
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Installer network and lifecycle regressions
        run: python3 -m unittest discover -s packaging/tests -p test_installer.py -v
      - name: Configure standalone source (no downloaded SDK or Go modules)
        run: cmake -S . -B build -G Ninja -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$GITHUB_WORKSPACE/tmp/prefix"
      - name: Weather-only backend protocol tests
        run: GOTOOLCHAIN=local GOPROXY=off GOSUMDB=off go -C backend test -count=1 ./...
      - name: Compile
        run: cmake --build build --parallel 2
      - name: Stage private install prefix
        run: cmake --install build
      - name: Private backend lifecycle and ownership
        run: python3 tests/backend-lifecycle.py "$PWD/build/backend/kos-weather-backend"
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate immutable source release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test "$RELEASE_TAG" = "v$(tr -d '\n' < VERSION)"
          mkdir -p tmp/release
          python3 packaging/prepare-release.py --app weather --version "$(tr -d '\n' < VERSION)" --revision "$GITHUB_SHA" --output tmp/release/app-release.json
      - name: Publish reviewed-source release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" tmp/release/app-release.json --verify-tag --title "$RELEASE_TAG" --notes "Independent source release. Use ./install.sh install or Settings. Development dependencies are required; installation never installs system packages and uninstall preserves user data."
