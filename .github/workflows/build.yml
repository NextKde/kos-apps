name: Compile selected application
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        app: [calendar, calculator, weather]
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ python3 golang-go qt6-base-dev qt6-declarative-dev qt6-tools-dev qt6-l10n-tools libkf6calendarcore-dev
      - name: Compile and stage selected application (no tests or app launch)
        env:
          APP: ${{ matrix.app }}
        run: |
          cmake -S . -B tmp/build -G Ninja -DKOS_APPS="$APP" -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX="$PWD/tmp/stage"
          cmake --build tmp/build --parallel 2
          cmake --install tmp/build
