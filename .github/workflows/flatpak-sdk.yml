name: Build unsigned Flatpak SDK candidates

# Build evidence only. Signing and publication require separate reviewed steps.
on:
  pull_request:
    paths:
      - '.github/workflows/flatpak-sdk.yml'
      - 'packaging/flatpak/**'
  workflow_dispatch:
    inputs:
      revision:
        description: Reviewed full 40-character source commit including packaging
        required: true
      release_date:
        description: AppStream release date (YYYY-MM-DD)
        required: true
permissions:
  contents: read
jobs:
  sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        app: [calendar, calculator, weather]
    env:
      SOURCE_REVISION: ${{ inputs.revision || github.event.pull_request.head.sha }}
      RELEASE_DATE: ${{ inputs.release_date || '2026-11-05' }}
      APP: ${{ matrix.app }}
    steps:
      - name: Validate immutable inputs
        run: |
          [[ "$SOURCE_REVISION" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_REVISION }}
          persist-credentials: false
      - name: Provision disposable build environment
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder ostree gnupg python3 curl
          mkdir -p tmp/sdk/evidence
          curl --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 15 --max-time 60 \
            https://flathub.org/repo/flathub.flatpakrepo \
            -o tmp/sdk/evidence/flathub.flatpakrepo
          flatpak --user remote-add --if-not-exists flathub tmp/sdk/evidence/flathub.flatpakrepo
          flatpak --user install --noninteractive flathub org.kde.Sdk//6.11 org.kde.Platform//6.11
      - name: Prepare pinned manifest and record environment
        run: |
          python3 - <<'PY'
          import base64
          import configparser
          from datetime import date
          import json
          import os
          from pathlib import Path
          import subprocess
          root = Path('tmp/sdk')
          app_id = 'org.nextks.' + os.environ['APP']
          revision = os.environ['SOURCE_REVISION']
          release_date = os.environ['RELEASE_DATE']
          assert date.fromisoformat(release_date).isoformat() == release_date
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == revision
          manifest = json.loads(Path(f'packaging/flatpak/{app_id}.json').read_text())
          manifest['modules'][-1]['sources'] = [{
              'type': 'git', 'url': 'https://github.com/NextKde/kos-apps.git', 'commit': revision}]
          manifest['modules'][-1]['config-opts'].append(f'-DKOS_FLATPAK_RELEASE_DATE={release_date}')
          (root / f'{app_id}.json').write_text(json.dumps(manifest, indent=2) + '\n')
          environment = {}
          for role in ('runtime', 'sdk'):
              ref = f"{manifest[role]}/x86_64/{manifest['runtime-version']}"
              commit = subprocess.check_output(['flatpak', 'info', '--user', '--show-commit', ref], text=True).strip()
              environment[role] = {'ref': ref, 'commit': commit}
          (root / 'evidence/environment.json').write_text(json.dumps(environment, indent=2) + '\n')
          config = configparser.ConfigParser()
          config.read(root / 'evidence/flathub.flatpakrepo')
          (root / 'evidence/flathub-public.gpg').write_bytes(base64.b64decode(config['Flatpak Repo']['GPGKey'], validate=True))
          PY
          install -d -m 700 tmp/sdk/key-inspection
          gpg --batch --homedir "$PWD/tmp/sdk/key-inspection" --with-colons \
            --show-keys tmp/sdk/evidence/flathub-public.gpg > tmp/sdk/evidence/flathub-public-key.txt
          flatpak remotes --user --show-details > tmp/sdk/evidence/remotes.txt
          flatpak --version > tmp/sdk/evidence/flatpak-version.txt
          flatpak-builder --version > tmp/sdk/evidence/builder-version.txt
      - name: Build app and source export without signing or installing
        run: |
          flatpak-builder --user --arch=x86_64 --default-branch=stable \
            --disable-rofiles-fuse --disable-tests --bundle-sources \
            --state-dir="$PWD/tmp/sdk/state" --repo="$PWD/tmp/sdk/repo" \
            tmp/sdk/build "tmp/sdk/org.nextks.$APP.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          environment = json.loads(Path('tmp/sdk/evidence/environment.json').read_text())
          for role, entry in environment.items():
              actual = subprocess.check_output(['flatpak', 'info', '--user', '--show-commit', entry['ref']], text=True).strip()
              if actual != entry['commit']:
                  raise SystemExit(f'{role} changed during build')
          PY
          ostree --repo=tmp/sdk/repo refs > tmp/sdk/evidence/exported-refs.txt
          tar -C tmp/sdk -czf "tmp/org.nextks.$APP-unsigned-sdk-x86_64.tar.gz" \
            repo evidence "org.nextks.$APP.json"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: org.nextks.${{ matrix.app }}-unsigned-sdk-x86_64
          path: |
            tmp/org.nextks.*-unsigned-sdk-x86_64.tar.gz
            tmp/sdk/evidence/
            tmp/sdk/*.json
          if-no-files-found: error
          retention-days: 7
